<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Referencias de Reels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Estética de Shu (gatito azul): azul cielo, amarillo crema y rosa de mejillas, contornos café tipo sticker y letra redonda. */
:root {
  --bg: #fdf8ea;
  --bg-2: #e7f3fd;
  --surface: #ffffff;
  --ink: #3b1d14;
  --muted: #7a5e55;
  --line: #3b1d14;
  --accent: #2f95e8;
  --accent-ink: #ffffff;
  --soft: #fde7ea;
  --cream: #fbefc4;
  --star: #f5c33b;
  --shadow: 0 4px 0 rgba(59, 29, 20, .9);
  --f-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161b2e; --bg-2: #1d2742; --surface: #232c48; --ink: #fdf3e4; --muted: #b9b3c9;
    --line: #0d1020; --accent: #6cb8f6; --accent-ink: #10203a; --soft: #4a2c3d; --cream: #4a4230; --star: #f5c33b;
    --shadow: 0 4px 0 rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161b2e; --bg-2: #1d2742; --surface: #232c48; --ink: #fdf3e4; --muted: #b9b3c9;
  --line: #0d1020; --accent: #6cb8f6; --accent-ink: #10203a; --soft: #4a2c3d; --cream: #4a4230; --star: #f5c33b;
  --shadow: 0 4px 0 rgba(0, 0, 0, .55);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: linear-gradient(180deg, var(--bg-2) 0, var(--bg) 360px) var(--bg);
  color: var(--ink); font-family: var(--f-body);
  font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 56px;
}
.wrap { max-width: 1080px; margin: 0 auto; }
header { display: flex; flex-direction: column; gap: 18px; margin-bottom: 28px; }
.hero { display: flex; align-items: center; gap: 16px; }
.logo { width: clamp(84px, 22vw, 128px); height: auto; flex: none; filter: drop-shadow(0 3px 0 rgba(59, 29, 20, .25)); }
.eyebrow {
  display: inline-block; font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink); background: var(--cream); border: 2px solid var(--line); border-radius: 999px; padding: 2px 12px;
}
h1 {
  font-family: var(--f-display); font-weight: 800; font-size: clamp(34px, 8vw, 58px);
  line-height: 1; margin: 8px 0 0; text-wrap: balance; letter-spacing: -.01em;
}
h1 span { color: var(--accent); }
.sub { color: var(--muted); max-width: 52ch; margin: 0; font-weight: 500; }
.tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.search {
  flex: 1 1 240px; min-width: 0; padding: 12px 16px; border-radius: 999px;
  border: 2.5px solid var(--line); background: var(--surface); color: var(--ink);
  font: inherit; font-weight: 700;
}
.search::placeholder { color: var(--muted); font-weight: 500; }
.search:focus-visible, button:focus-visible, a:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.toggle {
  padding: 12px 18px; border-radius: 999px; border: 2.5px solid var(--line);
  background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 800; cursor: pointer;
  box-shadow: 0 3px 0 var(--line);
}
.toggle:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.count { color: var(--muted); font-size: 13px; font-weight: 700; margin-left: auto; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 22px; align-items: start; }
.card { background: var(--surface); border-radius: 24px; box-shadow: var(--shadow); overflow: hidden; border: 2.5px solid var(--line); }
.card summary { list-style: none; cursor: pointer; display: block; position: relative; }
.card summary::-webkit-details-marker { display: none; }
.thumb { position: relative; aspect-ratio: 3 / 4; background: var(--cream); overflow: hidden; }
.thumb img { width: 100%; height: 100%; display: block; object-fit: cover; }
.thumb::after {
  content: ""; position: absolute; inset: auto 0 0 0; height: 50%;
  background: linear-gradient(to top, rgba(30, 14, 10, .78), rgba(30, 14, 10, 0));
}
.who { position: absolute; left: 16px; right: 56px; bottom: 14px; z-index: 1; color: #fff; }
.who small { display: block; font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; opacity: .85; }
.who strong { font-family: var(--f-display); font-weight: 800; font-size: 22px; line-height: 1.15; overflow-wrap: anywhere; }
.chev {
  position: absolute; right: 14px; bottom: 14px; z-index: 1; width: 34px; height: 34px; border-radius: 50%;
  background: var(--accent); color: var(--accent-ink); border: 2.5px solid #3b1d14; display: grid; place-items: center;
  transition: transform .2s ease;
}
.card[open] .chev { transform: rotate(180deg); }
.body { padding: 16px 18px 20px; display: flex; flex-direction: column; gap: 14px; }
.body p { margin: 0; }
.label {
  display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
  color: var(--ink); background: var(--soft); border-radius: 999px; padding: 1px 10px; margin-bottom: 6px;
}
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px;
  font-weight: 800; text-decoration: none; font-size: 14px; border: 2.5px solid var(--line); box-shadow: 0 3px 0 var(--line);
}
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.btn.main { background: var(--accent); color: var(--accent-ink); }
.btn.alt { background: var(--cream); color: var(--ink); }
.btn:hover { filter: brightness(1.05); }
.empty { grid-column: 1 / -1; color: var(--muted); padding: 40px 0; text-align: center; font-weight: 700; }
@media (prefers-reduced-motion: reduce) { .chev { transition: none; } }
</style>
</head>
<body>

<div class="wrap">

    <div class="hero">
      <img class="logo" src="assets/shu-logo.png" alt="Logo de Shu" onerror="this.remove()">

        <div class="eyebrow">✦ Shu World ✦</div>
        <h1>Referencias de <span>Reels</span></h1>
      </div>
    </div>
    <p class="sub">Videos para usar de guía. Abre cada tarjeta para ver de qué trata, ir al reel original o visitar el canal.</p>
    <div class="tools">
      <input class="search" id="q" type="search" placeholder="Buscar por usuario o tema" aria-label="Buscar">
      <button class="toggle" id="tg" type="button">Colapsar todo</button>
      <span class="count" id="ct"></span>
    </div>
  </header>
  <main class="grid" id="grid"></main>
</div>

var grid = document.getElementById("grid");
var q = document.getElementById("q");
var tg = document.getElementById("tg");
var ct = document.getElementById("ct");
var CHEV = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3.5 6l4.5 4.5L12.5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var ARR = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M5 11l6-6M6 5h5v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function render() {
  var term = q.value.trim().toLowerCase();
  var list = REELS.filter(function (r) {
    return !term || (r.user + " " + r.desc).toLowerCase().indexOf(term) !== -1;
  });
  ct.textContent = list.length + (list.length === 1 ? " reel" : " reels");
  if (!list.length) {
    grid.innerHTML = '<p class="empty">No hay reels que coincidan con esa búsqueda.</p>';
    return;
  }
  grid.innerHTML = list.map(function (r) {
    // si la portada no carga, se quita la imagen y queda el fondo de color de .thumb
    var img = r.thumb ? '<img src="' + esc(r.thumb) + '" alt="Portada del reel de ' + esc(r.user) + '" loading="lazy" onerror="this.remove()">' : '';
    return '<details class="card" open>' +
      '<summary><div class="thumb">' + img +
      '<div class="who"><small>Creador</small><strong>' + esc(r.user) + '</strong></div>' +
      '<span class="chev">' + CHEV + '</span></div></summary>' +
      '<div class="body">' +
      '<div><div class="label">De qué trata</div><p>' + esc(r.desc) + '</p></div>' +
      '<div class="actions">' +
      '<a class="btn main" href="' + esc(r.url) + '" target="_blank" rel="noopener">Ver reel ' + ARR + '</a>' +
      '<a class="btn alt" href="' + esc(r.channel) + '" target="_blank" rel="noopener">Ver canal ' + ARR + '</a>' +
      '</div></div></details>';
  }).join("");
  syncLabel();
}

function syncLabel() {
  var all = grid.querySelectorAll("details");
  var anyOpen = Array.prototype.some.call(all, function (d) { return d.open; });
  tg.textContent = anyOpen ? "Colapsar todo" : "Expandir todo";
}

tg.addEventListener("click", function () {
  var all = grid.querySelectorAll("details");
  var anyOpen = Array.prototype.some.call(all, function (d) { return d.open; });
  all.forEach(function (d) { d.open = !anyOpen; });
  syncLabel();
});
grid.addEventListener("toggle", syncLabel, true);
q.addEventListener("input", render);
render();
</script>
